<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskGrid | Professional To-Do</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskGrid">

  <style>
    /* --- CSS VARIABLES: MIDNIGHT SAAS --- */
    :root {
      --bg-color: #000000;
      --glass-bg: rgba(10, 10, 10, 0.7);
      --glass-border: #222222;
      --text-main: #ededed;
      --text-muted: #888888;
      --accent-primary: #5e6ad2;
      --accent-success: #2e9961;
      --accent-danger: #e35050;
      --input-bg: #111111;
      --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.8);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    /* --- SUBTLE ANIMATED BACKGROUND --- */
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-animation {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      background: radial-gradient(circle at 50% 0%, rgba(94, 106, 210, 0.15) 0%, #000000 60%);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    /* --- LAYOUT --- */
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 1;
    }

    /* --- HEADER --- */
    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(to right, #ffffff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* --- GLASS COMPONENT --- */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
    }

    /* --- PROGRESS BAR --- */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .progress-title { font-weight: 600; font-size: 0.95rem; }
    .progress-stats { font-size: 1.2rem; font-weight: 700; color: var(--accent-primary); }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--input-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), #8a96ff);
      border-radius: 8px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- INPUT FORM --- */
    .task-form {
      display: flex;
      gap: 12px;
    }

    .task-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
    }

    .task-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 1px var(--accent-primary);
    }

    .btn-add {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 0 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-add:active { transform: scale(0.95); opacity: 0.9; }

    /* --- TASK LIST & SWIPE ACTIONS --- */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
    }

    /* Background revealed on swipe */
    .swipe-actions {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #fff;
      z-index: 1;
    }

    .swipe-complete { color: var(--accent-success); opacity: 0; transition: opacity 0.2s; }
    .swipe-delete { color: var(--accent-danger); opacity: 0; transition: opacity 0.2s; }

    /* Foreground Task Card */
    .task-content {
      position: relative;
      z-index: 2;
      background: var(--glass-bg);
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .task-content.completed {
      opacity: 0.5;
    }

    .task-content.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Custom Checkbox */
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--text-muted);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .task-content.completed .checkbox {
      background: var(--accent-success);
      border-color: var(--accent-success);
    }

    .task-content.completed .checkbox::after {
      content: '✓';
      color: #000;
      font-weight: bold;
      font-size: 14px;
    }

    .task-text {
      flex: 1;
      font-size: 1.05rem;
      line-height: 1.4;
      pointer-events: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* --- TOAST NOTIFICATIONS --- */
    #toast-container {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      background: var(--accent-success);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 8px 20px rgba(46, 153, 97, 0.25);
      animation: slideUpFade 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards, slideDownFade 0.4s ease-in 2.5s forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDownFade {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <main class="app-container">
    <header>
      <h1>TaskGrid</h1>
      <p>Organize, execute, and achieve.</p>
    </header>

    <!-- Progress Dashboard -->
    <section class="glass-card">
      <div class="progress-header">
        <div>
          <div class="progress-title">Daily Progress</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="task-count">0 of 0 tasks completed</div>
        </div>
        <div class="progress-stats" id="progress-percent">0%</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- Add Task Form -->
    <form class="task-form" id="task-form">
      <input type="text" id="task-input" class="task-input" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- Tasks Area -->
    <ul class="task-list" id="task-list"></ul>
    <div id="empty-state" class="empty-state">
      You're all caught up. Take a break or add a new task!
    </div>
  </main>

  <!-- Container for Cheering Quotes -->
  <div id="toast-container"></div>

  <script>
    // --- State & Config ---
    const STORAGE_KEY = 'taskgrid_saas_v1';
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const motivationalQuotes = [
      "Outstanding work!",
      "Keep up the great momentum!",
      "Task crushed! 🔥",
      "You're unstoppable!",
      "Brilliant job!",
      "One step closer to your goals!",
      "Nailed it! 🎯",
      "Productivity at its finest!"
    ];

    // --- DOM Elements ---
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const taskCount = document.getElementById('task-count');
    const toastContainer = document.getElementById('toast-container');

    // --- Helpers ---
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));

    const escapeHtml = (unsafe) => {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    };

    const showToast = () => {
      const quote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = quote;
      toastContainer.appendChild(toast);
      
      // Clean up DOM after animation finishes (approx 3s)
      setTimeout(() => toast.remove(), 3000);
    };

    // --- Core Logic ---
    const updateProgress = () => {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      
      progressFill.style.width = `${percentage}%`;
      progressPercent.textContent = `${percentage}%`;
      taskCount.textContent = `${completed} of ${total} tasks completed`;
    };

    const toggleCompletion = (id, skipToast = false) => {
      const task = tasks.find(t => t.id === id);
      task.completed = !task.completed;
      save();
      render();
      if (task.completed && !skipToast) showToast();
    };

    const deleteTask = (id) => {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    };

    const render = () => {
      list.innerHTML = '';
      emptyState.style.display = tasks.length === 0 ? 'block' : 'none';

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.dataset.id = task.id;

        li.innerHTML = `
          <div class="swipe-actions">
            <span class="swipe-complete">✓ Complete</span>
            <span class="swipe-delete">✕ Delete</span>
          </div>
          <div class="task-content ${task.completed ? 'completed' : ''}">
            <div class="checkbox"></div>
            <span class="task-text">${escapeHtml(task.title)}</span>
          </div>
        `;
        list.appendChild(li);
      });

      updateProgress();
    };

    // --- Event Listeners ---
    form.addEventListener('submit', e => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      tasks.unshift({
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        title,
        completed: false,
        createdAt: Date.now()
      });

      save();
      input.value = '';
      input.blur();
      render();
    });

    // Handle Tap on Checkbox
    list.addEventListener('click', e => {
      const taskContent = e.target.closest('.task-content');
      if (!taskContent) return;
      
      if (e.target.classList.contains('checkbox')) {
        const id = taskContent.parentElement.dataset.id;
        toggleCompletion(id);
      }
    });

    // --- Swipe Interaction Logic ---
    let startX = 0;
    let currentX = 0;
    let swipingElement = null;
    let actionBgComplete = null;
    let actionBgDelete = null;

    list.addEventListener('touchstart', e => {
      const target = e.target.closest('.task-content');
      if (!target) return;
      
      startX = e.touches[0].clientX;
      swipingElement = target;
      swipingElement.style.transition = 'none';

      // Select background action text to adjust opacity
      const parent = swipingElement.parentElement;
      actionBgComplete = parent.querySelector('.swipe-complete');
      actionBgDelete = parent.querySelector('.swipe-delete');
    }, { passive: true });

    list.addEventListener('touchmove', e => {
      if (!swipingElement) return;
      currentX = e.touches[0].clientX;
      const deltaX = currentX - startX;
      
      // Visual feedback: slide element
      swipingElement.style.transform = `translate3d(${deltaX}px, 0, 0)`;

      // Fade in background text based on swipe direction
      if (deltaX > 0) {
        // Swiping Right (Complete)
        swipingElement.parentElement.style.background = 'rgba(46, 153, 97, 0.15)'; 
        actionBgComplete.style.opacity = Math.min(deltaX / 80, 1);
        actionBgDelete.style.opacity = 0;
      } else {
        // Swiping Left (Delete)
        swipingElement.parentElement.style.background = 'rgba(227, 80, 80, 0.15)'; 
        actionBgDelete.style.opacity = Math.min(Math.abs(deltaX) / 80, 1);
        actionBgComplete.style.opacity = 0;
      }
    }, { passive: true });

    list.addEventListener('touchend', e => {
      if (!swipingElement) return;
      const deltaX = currentX - startX;
      const li = swipingElement.parentElement;
      const id = li.dataset.id;
      
      swipingElement.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
      
      const threshold = 90; // Pixels required to trigger action

      if (deltaX > threshold) {
        // Trigger Complete
        swipingElement.style.transform = `translate3d(100%, 0, 0)`;
        setTimeout(() => {
          toggleCompletion(id);
        }, 300);
      } else if (deltaX < -threshold) {
        // Trigger Delete
        swipingElement.style.transform = `translate3d(-100%, 0, 0)`;
        setTimeout(() => deleteTask(id), 300);
      } else {
        // Snap back to original position if threshold not met
        swipingElement.style.transform = `translate3d(0, 0, 0)`;
        swipingElement.parentElement.style.background = 'var(--input-bg)';
        if(actionBgComplete) actionBgComplete.style.opacity = 0;
        if(actionBgDelete) actionBgDelete.style.opacity = 0;
      }
      
      swipingElement = null;
    });

    // --- Initial Render ---
    render();

    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('TaskGrid SW Registered:', reg.scope))
          .catch(err => console.error('TaskGrid SW Failed:', err));
      });
    }
  </script>
</body>
</html>
