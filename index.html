<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskGrid // Minimalist To-Do</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f293d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #00e676;
      --accent-cyan: #00e5ff;
      --accent-red: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    header {
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .input-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent-cyan);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    select {
      background: #1a2234;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      outline: none;
    }

    button.btn-add {
      background: var(--accent-green);
      color: #05140b;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }

    button.btn-add:hover {
      opacity: 0.9;
    }

    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .filter-btn.active {
      color: var(--text);
      background: #1e293b;
      border-color: var(--border);
    }

    .stats {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .task-item:hover {
      border-color: #2e3d5b;
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    .task-title {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .priority-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .priority-high {
      background: rgba(255, 51, 102, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 51, 102, 0.3);
    }

    .priority-medium {
      background: rgba(0, 229, 255, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .priority-low {
      background: rgba(156, 163, 175, 0.12);
      color: var(--text-muted);
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      margin-left: 12px;
      transition: color 0.15s;
    }

    .btn-delete:hover {
      color: var(--accent-red);
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="dot"></div>
        <span>TaskGrid</span>
      </div>
      <div class="subtitle">Local execution pipeline & task manager</div>
    </header>

    <!-- Input Box -->
    <form id="todo-form" class="input-box">
      <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off" required />
      <select id="priority-select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- Filters & Stats -->
    <div class="filters">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div class="stats" id="task-counter">0 tasks remaining</div>
    </div>

    <!-- Task List -->
    <ul class="task-list" id="task-list"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">No tasks in queue. You are all caught up.</div>
  </div>

  <script>
    const STORAGE_KEY = "taskgrid_items";
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = "all";

    const form = document.getElementById("todo-form");
    const input = document.getElementById("task-input");
    const prioritySelect = document.getElementById("priority-select");
    const list = document.getElementById("task-list");
    const counter = document.getElementById("task-counter");
    const emptyState = document.getElementById("empty-state");
    const filterButtons = document.querySelectorAll(".filter-btn");

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      render();
    }

    function render() {
      list.innerHTML = "";

      const filtered = tasks.filter((t) => {
        if (currentFilter === "active") return !t.completed;
        if (currentFilter === "completed") return t.completed;
        return true;
      });

      if (filtered.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
      }

      filtered.forEach((task) => {
        const li = document.createElement("li");
        li.className = `task-item ${task.completed ? "completed" : ""}`;

        li.innerHTML = `
          <div class="task-content">
            <input type="checkbox" ${task.completed ? "checked" : ""} data-id="${task.id}" />
            <span class="task-title">${escapeHtml(task.title)}</span>
          </div>
          <div style="display: flex; align-items: center;">
            <span class="priority-badge priority-${task.priority}">${task.priority}</span>
            <button class="btn-delete" data-id="${task.id}">&times;</button>
          </div>
        `;
        list.appendChild(li);
      });

      const activeCount = tasks.filter((t) => !t.completed).length;
      counter.textContent = `${activeCount} task${activeCount === 1 ? "" : "s"} remaining`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      tasks.push({
        id: Date.now().toString(),
        title,
        priority: prioritySelect.value,
        completed: false,
      });

      input.value = "";
      saveTasks();
    });

    list.addEventListener("click", (e) => {
      const id = e.target.getAttribute("data-id");
      if (!id) return;

      if (e.target.type === "checkbox") {
        tasks = tasks.map((t) => (t.id === id ? { ...t, completed: e.target.checked } : t));
        saveTasks();
      } else if (e.target.classList.contains("btn-delete")) {
        tasks = tasks.filter((t) => t.id !== id);
        saveTasks();
      }
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        render();
      });
    });

    render();
  </script>
</body>
</html>
