<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskGrid | To-Do List</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskGrid">
  
  <!-- Fallback icon (replace with actual paths in production) -->
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/0f172a/00f0ff?text=TG">

  <style>
    /* ----------------------------------
       CSS VARIABLES (THEMING & DESIGN)
       ---------------------------------- */
    :root {
      /* Light Mode Palette */
      --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: rgba(255, 255, 255, 0.8);
      --input-border: rgba(15, 23, 42, 0.1);
      --danger-bg: #ef4444;
      --shadow-color: rgba(15, 23, 42, 0.1);
      
      /* Accents */
      --accent-cyan: #0ea5e9;
      --accent-green: #10b981;
      --accent-pink: #f43f5e;
    }

    [data-theme="dark"] {
      /* Cyber-Developer Dark Mode Palette */
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #151025 100%);
      --glass-bg: rgba(15, 23, 42, 0.5);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(2, 6, 23, 0.6);
      --input-border: rgba(255, 255, 255, 0.1);
      --danger-bg: #e11d48;
      --shadow-color: rgba(0, 0, 0, 0.5);
      
      /* Cyber Accents */
      --accent-cyan: #00f0ff;
      --accent-green: #00ff66;
      --accent-pink: #ff007f;
    }

    /* ----------------------------------
       GLOBAL RESETS & BASE
       ---------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- Ambient Animated Glow Layer --- */
body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 16px 80px 16px;
  transition: color 0.4s ease;
  overflow-x: hidden;
  position: relative;
}

/* Floating ambient light blobs */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
  pointer-events: none;
  opacity: 0.45;
  will-change: transform;
}

/* Cyan/Blue ambient orb */
body::before {
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
  top: -60px;
  left: -80px;
  animation: floatAmbientOne 18s ease-in-out infinite alternate;
}

/* Purple/Pink ambient orb */
body::after {
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
  bottom: 5%;
  right: -100px;
  animation: floatAmbientTwo 22s ease-in-out infinite alternate;
}

/* Light mode softens the glow opacity */
[data-theme="light"] body::before,
[data-theme="light"] body::after {
  opacity: 0.25;
}

/* Ensure the app stays above the glow layer */
.app-container {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  z-index: 1;
}

/* Ambient Floating Keyframes */
@keyframes floatAmbientOne {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(90px, 140px, 0) scale(1.15);
  }
  100% {
    transform: translate3d(30px, 280px, 0) scale(0.95);
  }
}

@keyframes floatAmbientTwo {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(-100px, -120px, 0) scale(1.2);
  }
  100% {
    transform: translate3d(-40px, -240px, 0) scale(0.9);
  }
}


    /* ----------------------------------
       LAYOUT & UTILITIES
       ---------------------------------- */
    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 10px 30px var(--shadow-color);
    }

    /* 48px Minimum Touch Target */
    button, input, select {
      min-height: 48px;
      font-size: 1rem;
      outline: none;
    }

    /* ----------------------------------
       HEADER
       ---------------------------------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .neon-dot {
      width: 12px;
      height: 12px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    .theme-toggle {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    
    .theme-toggle:active {
      transform: scale(0.9);
    }

    /* ----------------------------------
       PROGRESS BAR
       ---------------------------------- */
    .progress-panel {
      padding: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--input-bg);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--input-border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-cyan);
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    /* ----------------------------------
       TASK ENTRY FORM
       ---------------------------------- */
    .input-panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    input.task-input {
      flex: 1;
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      border-radius: 12px;
      padding: 0 16px;
      transition: border-color 0.2s;
    }

    input.task-input:focus {
      border-color: var(--accent-cyan);
    }

    select.priority-select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      border-radius: 12px;
      padding: 0 12px;
      flex: 0.4;
      appearance: none;
      cursor: pointer;
    }

    button.btn-add {
      background: var(--accent-green);
      color: #000;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      padding: 0 20px;
      cursor: pointer;
      flex: 0.3;
      transition: opacity 0.2s;
    }

    button.btn-add:active {
      opacity: 0.8;
    }

    /* ----------------------------------
       FILTERS
       ---------------------------------- */
    .filters {
      display: flex;
      padding: 6px;
    }

    .filter-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--input-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px var(--shadow-color);
    }

    /* ----------------------------------
       TASK LIST & SWIPE-TO-DELETE
       ---------------------------------- */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      position: relative;
      border-radius: 16px;
      background: var(--danger-bg);
      overflow: hidden;
      will-change: transform;
    }

    /* The red background revealed on swipe */
    .task-delete-bg {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 24px;
      color: #fff;
      font-weight: bold;
      z-index: 1;
    }

    /* The actual task card that gets dragged */
    .task-foreground {
      position: relative;
      z-index: 2;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }

    .task-foreground.completed {
      opacity: 0.5;
    }

    /* Custom Checkbox */
    .custom-checkbox {
      appearance: none;
      min-height: 24px !important;
      width: 24px;
      height: 24px;
      border: 2px solid var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .custom-checkbox:checked {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .custom-checkbox:checked::after {
      content: '✔';
      position: absolute;
      color: #000;
      font-size: 14px;
      font-weight: 900;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Task Title & Inline Edit */
    .task-title {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      user-select: none; /* Prevents text selection on double-tap */
      line-height: 1.4;
      cursor: text;
    }

    .completed .task-title {
      text-decoration: line-through;
    }

    .inline-edit-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px;
      min-height: auto; /* override global */
      height: auto;
    }

    /* Badges */
    .badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-high { background: rgba(225, 29, 72, 0.15); color: var(--accent-pink); border: 1px solid rgba(225, 29, 72, 0.3); }
    .badge-medium { background: rgba(14, 165, 233, 0.15); color: var(--accent-cyan); border: 1px solid rgba(14, 165, 233, 0.3); }
    .badge-low { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); border: 1px solid rgba(100, 116, 139, 0.3); }

    /* Desktop fallback delete button */
    .btn-delete-desktop {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      min-height: 24px !important;
      padding: 8px;
      margin-right: -8px;
    }
    
    .btn-delete-desktop:hover { color: var(--accent-pink); }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Utility Class for Animations */
    .fade-out {
      opacity: 0;
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="neon-dot"></div>
        <h1>TaskGrid</h1>
      </div>
      <button class="theme-toggle" id="theme-btn" aria-label="Toggle Theme">🌞</button>
    </header>

    <!-- Progress Component -->
    <div class="glass progress-panel">
      <div class="progress-header">
        <span>Execution Progress</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Task Creation Form -->
    <form class="glass input-panel" id="task-form">
      <input type="text" id="task-input" class="task-input" placeholder="Initialize new task..." autocomplete="off" required>
      <div class="input-row">
        <select id="priority-select" class="priority-select">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">Critical Priority</option>
        </select>
        <button type="submit" class="btn-add">Deploy</button>
      </div>
    </form>

    <!-- Filters -->
    <div class="glass filters" id="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="active">Active</button>
      <button type="button" class="filter-btn" data-filter="done">Completed</button>
    </div>

    <!-- Task List -->
    <ul class="task-list" id="task-list"></ul>
    
    <div id="empty-state" class="empty-state" style="display: none;">
      All systems clear. Pipeline is empty.
    </div>

  </div>

  <script>
    /**
     * TaskGrid - Core Logic
     * Written in Vanilla JS. No dependencies.
     */

    // --- State Management ---
    const STORAGE_KEY = 'taskgrid_v1';
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = 'all';

    // --- DOM Elements ---
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const prioritySelect = document.getElementById('priority-select');
    const list = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const filterContainer = document.getElementById('filters');
    const themeBtn = document.getElementById('theme-btn');
    const htmlEl = document.documentElement;

    // --- Theming ---
    const savedTheme = localStorage.getItem('taskgrid_theme') || 'dark';
    htmlEl.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '🌞' : '🌙';

    themeBtn.addEventListener('click', () => {
      const isDark = htmlEl.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', newTheme);
      localStorage.setItem('taskgrid_theme', newTheme);
      themeBtn.textContent = newTheme === 'dark' ? '🌞' : '🌙';
    });

    // --- Helpers ---
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    
    // XSS Prevention
    const escapeHtml = (unsafe) => {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    };

    // --- Rendering Pipeline ---
    const render = () => {
      list.innerHTML = '';
      
      const filtered = tasks.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'done') return t.completed;
        return true;
      });

      emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item`;
        li.dataset.id = task.id;

        li.innerHTML = `
          <div class="task-delete-bg">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </div>
          <div class="glass task-foreground ${task.completed ? 'completed' : ''}">
            <input type="checkbox" class="custom-checkbox" ${task.completed ? 'checked' : ''}>
            <span class="task-title" title="Double tap to edit">${escapeHtml(task.title)}</span>
            <span class="badge badge-${task.priority}">${task.priority}</span>
            <button class="btn-delete-desktop">✕</button>
          </div>
        `;
        list.appendChild(li);
      });

      updateProgress();
    };

    const updateProgress = () => {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      
      progressFill.style.width = `${percentage}%`;
      progressText.textContent = `${percentage}%`;
    };

    // --- Actions ---
    form.addEventListener('submit', e => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      const newTask = {
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        title,
        priority: prioritySelect.value,
        completed: false,
        createdAt: Date.now()
      };

      tasks.unshift(newTask); // Prepend to top
      save();
      input.value = '';
      input.blur(); // Hide keyboard on mobile
      render();
    });

    const deleteTask = (id, liElement) => {
      if (liElement) {
        // Animate out
        liElement.classList.add('fade-out');
        liElement.style.transition = 'all 0.3s ease';
        setTimeout(() => {
          tasks = tasks.filter(t => t.id !== id);
          save();
          render();
        }, 300);
      } else {
        tasks = tasks.filter(t => t.id !== id);
        save();
        render();
      }
    };

    // --- Event Delegation (Click, Double Click) ---
    list.addEventListener('click', e => {
      const li = e.target.closest('.task-item');
      if (!li) return;
      const id = li.dataset.id;

      // Handle Checkbox
      if (e.target.classList.contains('custom-checkbox')) {
        const task = tasks.find(t => t.id === id);
        task.completed = e.target.checked;
        save();
        render();
      }

      // Handle Desktop Delete Button
      if (e.target.classList.contains('btn-delete-desktop')) {
        deleteTask(id, li);
      }
    });

    // Inline Editing (Double Click / Double Tap)
    list.addEventListener('dblclick', e => {
      if (e.target.classList.contains('task-title')) {
        const li = e.target.closest('.task-item');
        const id = li.dataset.id;
        const task = tasks.find(t => t.id === id);
        
        const inputEdit = document.createElement('input');
        inputEdit.type = 'text';
        inputEdit.value = task.title;
        inputEdit.className = 'inline-edit-input';
        
        e.target.replaceWith(inputEdit);
        inputEdit.focus();
        
        // Move cursor to end
        const val = inputEdit.value;
        inputEdit.value = '';
        inputEdit.value = val;

        const finalizeEdit = () => {
          const newTitle = inputEdit.value.trim();
          if (newTitle && newTitle !== task.title) {
            task.title = newTitle;
            save();
          }
          render();
        };

        inputEdit.addEventListener('blur', finalizeEdit);
        inputEdit.addEventListener('keypress', ev => {
          if (ev.key === 'Enter') {
            inputEdit.blur();
          }
        });
      }
    });

    // --- Mobile Swipe-to-Delete Implementation ---
    let startX = 0;
    let currentX = 0;
    let swipingElement = null;

    list.addEventListener('touchstart', e => {
      const target = e.target.closest('.task-foreground');
      if (!target) return;
      
      startX = e.touches[0].clientX;
      swipingElement = target;
      // Remove transition for 1:1 finger tracking
      swipingElement.style.transition = 'none';
    }, { passive: true });

    list.addEventListener('touchmove', e => {
      if (!swipingElement) return;
      currentX = e.touches[0].clientX;
      const deltaX = currentX - startX;
      
      // Only allow swiping to the left
      if (deltaX < 0) {
        swipingElement.style.transform = `translate3d(${deltaX}px, 0, 0)`;
      }
    }, { passive: true });

    list.addEventListener('touchend', e => {
      if (!swipingElement) return;
      const deltaX = currentX - startX;
      const li = swipingElement.closest('.task-item');
      const id = li.dataset.id;
      
      // Restore smooth transition
      swipingElement.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease';
      
      // Threshold for deletion: 80px swipe
      if (deltaX < -80) {
        swipingElement.style.transform = `translate3d(-100%, 0, 0)`;
        swipingElement.style.opacity = '0';
        
        setTimeout(() => {
          deleteTask(id, li);
        }, 300);
      } else {
        // Snap back to original position
        swipingElement.style.transform = `translate3d(0, 0, 0)`;
      }
      
      swipingElement = null;
    });

    // --- Filtering ---
    filterContainer.addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        render();
      }
    });

    // --- Init ---
    render();

    // --- PWA Service Worker Registration ---
    /* 
      To make this fully installable, ensure you have:
      1. A manifest.json file
      2. A sw.js file (Service Worker) 
      in the same root directory.
    */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('TaskGrid SW Registered:', reg.scope))
          .catch(err => console.error('TaskGrid SW Failed:', err));
      });
    }
  </script>
</body>
</html>
